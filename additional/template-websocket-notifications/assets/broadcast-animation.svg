<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 800 280" width="800" height="280">

  <defs>
    <marker id="a0" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#555"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#42a5f5"/>
    </marker>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- TITLE -->
  <text x="400" y="22" text-anchor="middle"
        font-family="monospace" font-size="14" font-weight="bold"
        fill="#42a5f5" letter-spacing="4">BROADCAST</text>

  <!--
    dur="11s"  |  5 equal steps × 2.2s = step_width=0.200
    S1  0.000–0.200  EventBridge → Lambda       (trigger)
    S2  0.200–0.400  Lambda → Events Table      (store)
    S3  0.400–0.600  Lambda → Subscriptions     (query)
    S4  0.600–0.800  Lambda → API GW            (send)
    S5  0.800–1.000  API GW → Browser           (deliver)

    Internal offsets (per 0.200 window):
      src_glow +0.018  dot_appear +0.036  arrow_on +0.045
      travel   +0.055  arrive     +0.145  recv_glow +0.164
      fade_end +0.182
  -->

  <!-- STEP LABELS -->
  <text x="558" y="78" text-anchor="middle"
        font-family="monospace" font-size="8" fill="#777">trigger<animate
          attributeName="fill" values="#777;#777;#42a5f5;#42a5f5;#777;#777"
          keyTimes="0;0.045;0.055;0.145;0.164;1"
          calcMode="linear" dur="11s" repeatCount="indefinite"/></text>

  <text x="558" y="130" text-anchor="middle"
        font-family="monospace" font-size="8" fill="#777">store<animate
          attributeName="fill" values="#777;#777;#42a5f5;#42a5f5;#777;#777"
          keyTimes="0;0.245;0.255;0.345;0.364;1"
          calcMode="linear" dur="11s" repeatCount="indefinite"/></text>

  <text x="558" y="184" text-anchor="middle"
        font-family="monospace" font-size="8" fill="#777">query<animate
          attributeName="fill" values="#777;#777;#42a5f5;#42a5f5;#777;#777"
          keyTimes="0;0.445;0.455;0.545;0.564;1"
          calcMode="linear" dur="11s" repeatCount="indefinite"/></text>

  <text x="369" y="124" text-anchor="middle"
        font-family="monospace" font-size="8" fill="#777">send<animate
          attributeName="fill" values="#777;#777;#42a5f5;#42a5f5;#777;#777"
          keyTimes="0;0.645;0.655;0.745;0.764;1"
          calcMode="linear" dur="11s" repeatCount="indefinite"/></text>

  <text x="169" y="124" text-anchor="middle"
        font-family="monospace" font-size="8" fill="#777">deliver<animate
          attributeName="fill" values="#777;#777;#42a5f5;#42a5f5;#777;#777"
          keyTimes="0;0.845;0.855;0.945;0.964;1"
          calcMode="linear" dur="11s" repeatCount="indefinite"/></text>

  <!-- STATIC CONNECTION LINES -->
  <!-- S1: EventBridge left (587,55) → Lambda top-right (537,110) -->
  <line x1="587" y1="55" x2="537" y2="110"
        stroke="#444" stroke-width="1.5" marker-end="url(#a0)"/>
  <!-- S2: Lambda center-right (537,135) → Events Table left (587,135) -->
  <line x1="537" y1="135" x2="587" y2="135"
        stroke="#444" stroke-width="1.5" marker-end="url(#a0)"/>
  <!-- S3: Lambda bottom-right (537,160) → SubsTable left (587,223) -->
  <line x1="537" y1="160" x2="587" y2="223"
        stroke="#444" stroke-width="1.5" marker-end="url(#a0)"/>
  <!-- S4: Lambda left (392,135) → API GW right (347,135) -->
  <line x1="392" y1="135" x2="347" y2="135"
        stroke="#444" stroke-width="1.5" marker-end="url(#a0)"/>
  <!-- S5: API GW left (192,135) → Browser right (147,135) -->
  <line x1="192" y1="135" x2="147" y2="135"
        stroke="#444" stroke-width="1.5" marker-end="url(#a0)"/>

  <!-- COMPONENT BOXES -->

  <!-- Browser — dest S5 -->
  <rect x="10" y="95" width="135" height="80" rx="10"
        fill="#0d2c14" stroke="#4CAF50" stroke-width="2">
    <animate attributeName="stroke"
             values="#4CAF50;#4CAF50;#42a5f5;#42a5f5;#4CAF50"
             keyTimes="0;0.945;0.964;0.982;1"
             calcMode="linear" dur="11s" repeatCount="indefinite"/>
    <animate attributeName="stroke-width"
             values="2;2;3;3;2"
             keyTimes="0;0.945;0.964;0.982;1"
             calcMode="linear" dur="11s" repeatCount="indefinite"/>
  </rect>
  <text x="77" y="133" text-anchor="middle"
        font-family="monospace" font-size="13" fill="#81C784">Browser</text>
  <text x="77" y="153" text-anchor="middle"
        font-family="monospace" font-size="11" fill="#66BB6A">Client</text>

  <!-- API Gateway — dest S4, source S5 -->
  <rect x="195" y="95" width="150" height="80" rx="10"
        fill="#2e1700" stroke="#FF9800" stroke-width="2">
    <animate attributeName="stroke"
             values="#FF9800;#FF9800;#42a5f5;#42a5f5;#FF9800"
             keyTimes="0;0.745;0.764;0.982;1"
             calcMode="linear" dur="11s" repeatCount="indefinite"/>
    <animate attributeName="stroke-width"
             values="2;2;3;3;2"
             keyTimes="0;0.745;0.764;0.982;1"
             calcMode="linear" dur="11s" repeatCount="indefinite"/>
  </rect>
  <text x="270" y="133" text-anchor="middle"
        font-family="monospace" font-size="12" fill="#FFB74D">WebSocket</text>
  <text x="270" y="153" text-anchor="middle"
        font-family="monospace" font-size="11" fill="#FFA726">API Gateway</text>

  <!-- Lambda — dest S1, source S2/S3/S4 (stays lit 0.145–0.782) -->
  <rect x="395" y="95" width="140" height="80" rx="10"
        fill="#1a0029" stroke="#9C27B0" stroke-width="2">
    <animate attributeName="stroke"
             values="#9C27B0;#9C27B0;#42a5f5;#42a5f5;#9C27B0;#9C27B0"
             keyTimes="0;0.145;0.164;0.782;0.800;1"
             calcMode="linear" dur="11s" repeatCount="indefinite"/>
    <animate attributeName="stroke-width"
             values="2;2;3;3;2;2"
             keyTimes="0;0.145;0.164;0.782;0.800;1"
             calcMode="linear" dur="11s" repeatCount="indefinite"/>
  </rect>
  <text x="465" y="133" text-anchor="middle"
        font-family="monospace" font-size="12" fill="#CE93D8">Broadcast λ</text>
  <text x="465" y="153" text-anchor="middle"
        font-family="monospace" font-size="11" fill="#BA68C8">Lambda</text>

  <!-- EventBridge — source S1 (x=590, y=15, h=60) -->
  <rect x="590" y="15" width="185" height="60" rx="10"
        fill="#1a1400" stroke="#FFC107" stroke-width="2">
    <animate attributeName="stroke"
             values="#FFC107;#42a5f5;#42a5f5;#FFC107;#FFC107"
             keyTimes="0;0.018;0.182;0.200;1"
             calcMode="linear" dur="11s" repeatCount="indefinite"/>
    <animate attributeName="stroke-width"
             values="2;3;3;2;2"
             keyTimes="0;0.018;0.182;0.200;1"
             calcMode="linear" dur="11s" repeatCount="indefinite"/>
  </rect>
  <text x="682" y="40" text-anchor="middle"
        font-family="monospace" font-size="12" fill="#FFD54F">EventBridge</text>
  <text x="682" y="58" text-anchor="middle"
        font-family="monospace" font-size="11" fill="#FFCA28">Bus</text>

  <!-- Events Table — dest S2 (x=590, y=105, h=60) -->
  <rect x="590" y="105" width="185" height="60" rx="10"
        fill="#00151a" stroke="#00BCD4" stroke-width="2">
    <animate attributeName="stroke"
             values="#00BCD4;#00BCD4;#42a5f5;#42a5f5;#00BCD4;#00BCD4"
             keyTimes="0;0.345;0.364;0.382;0.400;1"
             calcMode="linear" dur="11s" repeatCount="indefinite"/>
    <animate attributeName="stroke-width"
             values="2;2;3;3;2;2"
             keyTimes="0;0.345;0.364;0.382;0.400;1"
             calcMode="linear" dur="11s" repeatCount="indefinite"/>
  </rect>
  <text x="682" y="132" text-anchor="middle"
        font-family="monospace" font-size="12" fill="#80DEEA">Events Table</text>
  <text x="682" y="150" text-anchor="middle"
        font-family="monospace" font-size="11" fill="#4DD0E1">DynamoDB</text>

  <!-- Subscriptions Table — dest S3 (x=590, y=193, h=60) -->
  <rect x="590" y="193" width="185" height="60" rx="10"
        fill="#00151a" stroke="#00ACC1" stroke-width="2">
    <animate attributeName="stroke"
             values="#00ACC1;#00ACC1;#42a5f5;#42a5f5;#00ACC1;#00ACC1"
             keyTimes="0;0.545;0.564;0.582;0.600;1"
             calcMode="linear" dur="11s" repeatCount="indefinite"/>
    <animate attributeName="stroke-width"
             values="2;2;3;3;2;2"
             keyTimes="0;0.545;0.564;0.582;0.600;1"
             calcMode="linear" dur="11s" repeatCount="indefinite"/>
  </rect>
  <text x="682" y="218" text-anchor="middle"
        font-family="monospace" font-size="12" fill="#80DEEA">Subscriptions Table</text>
  <text x="682" y="236" text-anchor="middle"
        font-family="monospace" font-size="11" fill="#4DD0E1">DynamoDB</text>

  <!-- DESCRIPTION TEXTS (centered at bottom, y=268) -->
  <text x="510" y="50" text-anchor="middle"
        font-family="monospace" font-size="8.5" fill="#42a5f5" opacity="0">EventBridge triggers Lambda
    <animate attributeName="opacity" values="0;1;1;0;0"
             keyTimes="0;0.018;0.182;0.200;1"
             calcMode="linear" dur="11s" repeatCount="indefinite"/>
  </text>
  <text x="465" y="194" text-anchor="middle"
        font-family="monospace" font-size="8.5" fill="#42a5f5" opacity="0">Lambda stores event to Events Table
    <animate attributeName="opacity" values="0;0;1;1;0;0"
             keyTimes="0;0.218;0.236;0.382;0.400;1"
             calcMode="linear" dur="11s" repeatCount="indefinite"/>
  </text>
  <text x="465" y="194" text-anchor="middle"
        font-family="monospace" font-size="8.5" fill="#42a5f5" opacity="0">Lambda queries subscriptions
    <animate attributeName="opacity" values="0;0;1;1;0;0"
             keyTimes="0;0.418;0.436;0.582;0.600;1"
             calcMode="linear" dur="11s" repeatCount="indefinite"/>
  </text>
  <text x="465" y="194" text-anchor="middle"
        font-family="monospace" font-size="8.5" fill="#42a5f5" opacity="0">Lambda pushes to connections
    <animate attributeName="opacity" values="0;0;1;1;0;0"
             keyTimes="0;0.618;0.636;0.782;0.800;1"
             calcMode="linear" dur="11s" repeatCount="indefinite"/>
  </text>
  <text x="270" y="194" text-anchor="middle"
        font-family="monospace" font-size="8.5" fill="#42a5f5" opacity="0">API GW events to client
    <animate attributeName="opacity" values="0;0;1;1;0;0"
             keyTimes="0;0.818;0.836;0.982;1.000;1"
             calcMode="linear" dur="11s" repeatCount="indefinite"/>
  </text>

  <!-- BLUE ARROWS + DOTS -->

  <!-- S1: EventBridge → Lambda (587,55) → (537,110) -->
  <line x1="587" y1="55" x2="537" y2="110"
        stroke="#42a5f5" stroke-width="2.5" marker-end="url(#ab)" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0"
             keyTimes="0;0.036;0.045;0.145;0.164;1"
             calcMode="linear" dur="11s" repeatCount="indefinite"/>
  </line>
  <circle cx="0" cy="0" r="7" fill="#42a5f5" filter="url(#glow)">
    <animate attributeName="opacity" values="0;0;1;1;1;0;0"
             keyTimes="0;0.036;0.045;0.055;0.145;0.182;1"
             calcMode="linear" dur="11s" repeatCount="indefinite"/>
    <animateMotion keyPoints="0;0;0;0;1;1;1"
             keyTimes="0;0.036;0.045;0.055;0.145;0.182;1"
             calcMode="linear" dur="11s" repeatCount="indefinite"
             path="M587,55 L537,110"/>
  </circle>

  <!-- S2: Lambda → Events Table (537,135) → (587,135) -->
  <line x1="537" y1="135" x2="587" y2="135"
        stroke="#42a5f5" stroke-width="2.5" marker-end="url(#ab)" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0"
             keyTimes="0;0.236;0.245;0.345;0.364;1"
             calcMode="linear" dur="11s" repeatCount="indefinite"/>
  </line>
  <circle cx="0" cy="0" r="7" fill="#42a5f5" filter="url(#glow)">
    <animate attributeName="opacity" values="0;0;1;1;1;0;0"
             keyTimes="0;0.236;0.245;0.255;0.345;0.382;1"
             calcMode="linear" dur="11s" repeatCount="indefinite"/>
    <animateMotion keyPoints="0;0;0;0;1;1;1"
             keyTimes="0;0.236;0.245;0.255;0.345;0.382;1"
             calcMode="linear" dur="11s" repeatCount="indefinite"
             path="M537,135 L587,135"/>
  </circle>

  <!-- S3: Lambda → Subscriptions Table (537,160) → (587,223) -->
  <line x1="537" y1="160" x2="587" y2="223"
        stroke="#42a5f5" stroke-width="2.5" marker-end="url(#ab)" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0"
             keyTimes="0;0.436;0.445;0.545;0.564;1"
             calcMode="linear" dur="11s" repeatCount="indefinite"/>
  </line>
  <circle cx="0" cy="0" r="7" fill="#42a5f5" filter="url(#glow)">
    <animate attributeName="opacity" values="0;0;1;1;1;0;0"
             keyTimes="0;0.436;0.445;0.455;0.545;0.582;1"
             calcMode="linear" dur="11s" repeatCount="indefinite"/>
    <animateMotion keyPoints="0;0;0;0;1;1;1"
             keyTimes="0;0.436;0.445;0.455;0.545;0.582;1"
             calcMode="linear" dur="11s" repeatCount="indefinite"
             path="M537,160 L587,223"/>
  </circle>

  <!-- S4: Lambda → API GW (392,135) → (347,135) -->
  <line x1="392" y1="135" x2="347" y2="135"
        stroke="#42a5f5" stroke-width="2.5" marker-end="url(#ab)" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0"
             keyTimes="0;0.636;0.645;0.745;0.764;1"
             calcMode="linear" dur="11s" repeatCount="indefinite"/>
  </line>
  <circle cx="0" cy="0" r="7" fill="#42a5f5" filter="url(#glow)">
    <animate attributeName="opacity" values="0;0;1;1;1;0;0"
             keyTimes="0;0.636;0.645;0.655;0.745;0.782;1"
             calcMode="linear" dur="11s" repeatCount="indefinite"/>
    <animateMotion keyPoints="0;0;0;0;1;1;1"
             keyTimes="0;0.636;0.645;0.655;0.745;0.782;1"
             calcMode="linear" dur="11s" repeatCount="indefinite"
             path="M392,135 L347,135"/>
  </circle>

  <!-- S5: API GW → Browser (192,135) → (147,135) -->
  <line x1="192" y1="135" x2="147" y2="135"
        stroke="#42a5f5" stroke-width="2.5" marker-end="url(#ab)" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0"
             keyTimes="0;0.836;0.845;0.945;0.964;1"
             calcMode="linear" dur="11s" repeatCount="indefinite"/>
  </line>
  <circle cx="0" cy="0" r="7" fill="#42a5f5" filter="url(#glow)">
    <animate attributeName="opacity" values="0;0;1;1;1;0;0"
             keyTimes="0;0.836;0.845;0.855;0.945;0.982;1"
             calcMode="linear" dur="11s" repeatCount="indefinite"/>
    <animateMotion keyPoints="0;0;0;0;1;1;1"
             keyTimes="0;0.836;0.845;0.855;0.945;0.982;1"
             calcMode="linear" dur="11s" repeatCount="indefinite"
             path="M192,135 L147,135"/>
  </circle>

</svg>
